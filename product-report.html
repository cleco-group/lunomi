<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Produk - Lunomi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: white; min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold">Laporan Penjualan Produk</h1>
                <p class="text-sm text-white/50">Analisa menu terlaris dan performa penjualan</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 rounded-xl glass-card text-sm font-semibold">Kembali</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card p-6 rounded-2xl">
                <p class="text-xs font-bold text-white/40 uppercase mb-1">Total Item Terjual</p>
                <h3 id="totalQty" class="text-3xl font-extrabold">0</h3>
            </div>
            <div class="glass-card p-6 rounded-2xl">
                <p class="text-xs font-bold text-white/40 uppercase mb-1">Produk Terlaris</p>
                <h3 id="topProduct" class="text-xl font-extrabold text-indigo-400">—</h3>
            </div>
            <div class="glass-card p-6 rounded-2xl">
                <p class="text-xs font-bold text-white/40 uppercase mb-1">Total Omzet Produk</p>
                <h3 id="totalRevenue" class="text-3xl font-extrabold">Rp 0</h3>
            </div>
        </div>

        <div class="glass-card rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-white/5 text-xs font-bold uppercase tracking-wider text-white/40">
                        <th class="px-6 py-4">Nama Produk</th>
                        <th class="px-6 py-4 text-center">Qty Terjual</th>
                        <th class="px-6 py-4 text-right">Total Penjualan</th>
                        <th class="px-6 py-4 text-right">Kontribusi</th>
                    </tr>
                </thead>
                <tbody id="reportTable" class="divide-y divide-white/5">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function renderReport() {
            const trxs = JSON.parse(localStorage.getItem('lunomi_transactions') || '[]');
            const productMap = {};
            let totalQty = 0;
            let totalRevenue = 0;

            trxs.forEach(t => {
                t.items.forEach(item => {
                    if (!productMap[item.name]) {
                        productMap[item.name] = { qty: 0, revenue: 0 };
                    }
                    productMap[item.name].qty += item.qty;
                    productMap[item.name].revenue += (item.qty * item.price);
                    totalQty += item.qty;
                    totalRevenue += (item.qty * item.price);
                });
            });

            const sortedProducts = Object.entries(productMap)
                .map(([name, data]) => ({ name, ...data }))
                .sort((a, b) => b.qty - a.qty);

            document.getElementById('totalQty').textContent = totalQty.toLocaleString('id-ID');
            document.getElementById('totalRevenue').textContent = 'Rp ' + totalRevenue.toLocaleString('id-ID');
            document.getElementById('topProduct').textContent = sortedProducts.length > 0 ? sortedProducts[0].name : '—';

            const table = document.getElementById('reportTable');
            if (sortedProducts.length === 0) {
                table.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-white/30 text-sm">Belum ada data transaksi</td></tr>';
                return;
            }

            table.innerHTML = sortedProducts.map(p => {
                const contribution = ((p.revenue / totalRevenue) * 100).toFixed(1);
                return `
                    <tr class="hover:bg-white/5 transition">
                        <td class="px-6 py-4 font-bold text-sm">${p.name}</td>
                        <td class="px-6 py-4 text-center text-sm">${p.qty}</td>
                        <td class="px-6 py-4 text-right text-sm font-mono">Rp ${p.revenue.toLocaleString('id-ID')}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <div class="w-24 h-1.5 bg-white/5 rounded-full overflow-hidden">
                                    <div class="h-full bg-indigo-500" style="width: ${contribution}%"></div>
                                </div>
                                <span class="text-[10px] font-bold text-white/40 w-8">${contribution}%</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', renderReport);
    </script>
</body>
</html>
