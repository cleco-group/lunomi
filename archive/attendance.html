<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunomi — Absensi Staf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;}
        body{min-height:100vh;background:#020617;background-image:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(99,102,241,.2) 0%,transparent 60%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(16,185,129,.12) 0%,transparent 60%);color:white;overflow-x:hidden;}
        .glass-nav{background:rgba(2,6,23,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);}
        .glass-card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);}
        .input-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:white;outline:none;}
        .input-glass:focus{border-color:rgba(99,102,241,.6);}
        .staff-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:.75rem;padding:.75rem;text-align:left;cursor:pointer;transition:all .2s;width:100%;}
        .staff-btn:hover{background:rgba(255,255,255,.1);}
        .staff-btn.selected{background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.5);}
        .tab-btn{padding:.4rem 1rem;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);transition:all .2s;}
        .tab-btn.active{background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.5);color:white;}
        .toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.75rem 1.25rem;border-radius:1rem;font-size:.85rem;font-weight:600;z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s;pointer-events:none;}
        .toast.show{transform:translateY(0);opacity:1;}
        .toast-ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
        .toast-err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
    </style>
</head>
<body>

<nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-white opacity-50 hover:opacity-100 transition text-lg">←</button>
            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">🕐</div>
            <div>
                <div class="font-extrabold text-white text-sm">Absensi Staf</div>
                <div class="text-xs" style="color:rgba(255,255,255,.4)" id="outletLabel">—</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button class="tab-btn active" onclick="setTab('absen',this)">Clock In/Out</button>
            <button class="tab-btn" onclick="setTab('history',this)">Riwayat</button>
        </div>
    </div>
</nav>

<div class="max-w-5xl mx-auto px-4 py-6">

<!-- TAB: Absen -->
<div id="tabAbsen">
    <div class="grid md:grid-cols-2 gap-6">

        <!-- Clock Panel -->
        <div class="glass-card rounded-2xl p-6 text-center">
            <div class="text-4xl font-extrabold text-white mb-1" id="liveClock">00:00:00</div>
            <div class="text-xs mb-6" style="color:rgba(255,255,255,.4)" id="liveDate">—</div>

            <!-- Staff Selector -->
            <div class="text-left mb-4">
                <label class="text-xs font-semibold mb-2 block" style="color:rgba(255,255,255,.5)">Pilih Karyawan</label>
                <select id="staffSelect" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm">
                    <option value="">— Pilih karyawan —</option>
                </select>
            </div>

            <!-- Status indicator -->
            <div id="statusIndicator" class="mb-4 py-2 px-4 rounded-xl text-xs font-bold hidden"></div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="clockIn()" class="py-3.5 rounded-xl font-bold text-white transition" style="background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 16px rgba(16,185,129,.25)">
                    ▶ Clock In
                </button>
                <button onclick="clockOut()" class="py-3.5 rounded-xl font-bold text-white transition" style="background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 16px rgba(239,68,68,.25)">
                    ■ Clock Out
                </button>
            </div>

            <div class="mt-4">
                <label class="text-xs font-semibold mb-1.5 block text-left" style="color:rgba(255,255,255,.5)">Catatan (opsional)</label>
                <input type="text" id="absenNote" class="input-glass w-full px-3 py-2 rounded-xl text-sm" placeholder="cth: telat karena macet...">
            </div>
        </div>

        <!-- Today Summary -->
        <div class="space-y-4">
            <div class="glass-card rounded-2xl p-5">
                <div class="font-bold text-white text-sm mb-4">📋 Aktivitas Hari Ini</div>
                <div id="todayActivity" class="space-y-2">
                    <div class="text-sm text-center py-4" style="color:rgba(255,255,255,.3)">Belum ada absensi hari ini</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div class="glass-card rounded-2xl p-3 text-center">
                    <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Hadir</div>
                    <div class="text-xl font-extrabold text-green-400" id="statHadir">0</div>
                </div>
                <div class="glass-card rounded-2xl p-3 text-center">
                    <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Masih Di Sini</div>
                    <div class="text-xl font-extrabold text-indigo-400" id="statOnsite">0</div>
                </div>
                <div class="glass-card rounded-2xl p-3 text-center">
                    <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Pulang</div>
                    <div class="text-xl font-extrabold text-amber-400" id="statPulang">0</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- TAB: History -->
<div id="tabHistory" class="hidden">
    <div class="glass-card rounded-2xl overflow-hidden">
        <div class="px-5 py-4 flex items-center justify-between" style="border-bottom:1px solid rgba(255,255,255,.07)">
            <div class="font-bold text-white">Riwayat Absensi</div>
            <input type="month" id="monthFilter" class="input-glass px-3 py-1.5 rounded-xl text-xs" onchange="renderHistory()">
        </div>
        <div id="histBody"></div>
        <div id="histEmpty" class="hidden py-16 text-center">
            <div class="text-4xl mb-3">🕐</div>
            <div class="text-sm" style="color:rgba(255,255,255,.4)">Belum ada riwayat absensi</div>
        </div>
    </div>
</div>

</div>
<div id="toast" class="toast toast-ok"></div>

<script>
function getAttendance(){ return JSON.parse(localStorage.getItem('lunomi_attendance')||'[]'); }
function saveAttendance(arr){ localStorage.setItem('lunomi_attendance', JSON.stringify(arr)); }

function setTab(tab, btn){
    document.getElementById('tabAbsen').classList.toggle('hidden', tab!=='absen');
    document.getElementById('tabHistory').classList.toggle('hidden', tab!=='history');
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(tab==='history') renderHistory();
}

function updateClock(){
    const now = new Date();
    document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID',{hour12:false});
    document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}

function populateStaff(){
    const staff = JSON.parse(localStorage.getItem('lunomi_staff')||'[]').filter(s=>s.status==='active');
    const sel = document.getElementById('staffSelect');
    sel.innerHTML = '<option value="">— Pilih karyawan —</option>' +
        staff.map(s=>`<option value="${s.id}">${s.name} (${s.role})</option>`).join('');
    sel.addEventListener('change', checkStatus);
}

function checkStatus(){
    const staffId = document.getElementById('staffSelect').value;
    const ind = document.getElementById('statusIndicator');
    if(!staffId){ ind.classList.add('hidden'); return; }
    const today = new Date().toISOString().slice(0,10);
    const records = getAttendance().filter(a=>a.staffId===staffId && a.date===today);
    const lastRec = records[records.length-1];
    ind.classList.remove('hidden');
    if(!lastRec){
        ind.textContent = 'Belum clock in hari ini';
        ind.style.background = 'rgba(255,255,255,.07)';
        ind.style.color = 'rgba(255,255,255,.5)';
    } else if(lastRec.type==='in'){
        ind.textContent = `✓ Clock In: ${lastRec.time} — Sedang bertugas`;
        ind.style.background = 'rgba(16,185,129,.12)';
        ind.style.color = '#4ade80';
    } else {
        ind.textContent = `Sudah Clock Out: ${lastRec.time}`;
        ind.style.background = 'rgba(245,158,11,.12)';
        ind.style.color = '#fcd34d';
    }
}

function clockIn(){
    const staffId = document.getElementById('staffSelect').value;
    if(!staffId){ showToast('Pilih karyawan terlebih dahulu!', true); return; }
    const staff = JSON.parse(localStorage.getItem('lunomi_staff')||'[]').find(s=>s.id===staffId);
    const today = new Date().toISOString().slice(0,10);
    const existing = getAttendance().find(a=>a.staffId===staffId && a.date===today && a.type==='in');
    if(existing){ showToast(`${staff?.name||'Karyawan'} sudah clock in hari ini`, true); return; }

    const now = new Date();
    const rec = {
        id:'ATT-'+Date.now(), staffId, staffName:staff?.name||'—', role:staff?.role||'—',
        date:today, time:now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
        type:'in', note:document.getElementById('absenNote').value.trim(),
        createdAt:now.toISOString()
    };
    const arr = getAttendance();
    arr.push(rec);
    saveAttendance(arr);
    AuditLog.add('attendance_in', `Clock in: ${staff?.name||staffId} ${rec.time}`);
    document.getElementById('absenNote').value='';
    checkStatus();
    renderTodayActivity();
    showToast(`✓ ${staff?.name||'Karyawan'} Clock In ${rec.time}`);
}

function clockOut(){
    const staffId = document.getElementById('staffSelect').value;
    if(!staffId){ showToast('Pilih karyawan terlebih dahulu!', true); return; }
    const staff = JSON.parse(localStorage.getItem('lunomi_staff')||'[]').find(s=>s.id===staffId);
    const today = new Date().toISOString().slice(0,10);
    const todayRecs = getAttendance().filter(a=>a.staffId===staffId && a.date===today);
    const hasIn  = todayRecs.some(a=>a.type==='in');
    const hasOut = todayRecs.some(a=>a.type==='out');
    if(!hasIn){ showToast(`${staff?.name||'Karyawan'} belum clock in!`, true); return; }
    if(hasOut){ showToast(`${staff?.name||'Karyawan'} sudah clock out hari ini`, true); return; }

    const now = new Date();
    const inRec = todayRecs.find(a=>a.type==='in');
    let duration = '';
    if(inRec){
        const [inH,inM] = inRec.time.split(':').map(Number);
        const mins = (now.getHours()-inH)*60 + (now.getMinutes()-inM);
        const h = Math.floor(mins/60), m = mins%60;
        duration = `${h}j ${m}m`;
    }
    const rec = {
        id:'ATT-'+Date.now(), staffId, staffName:staff?.name||'—', role:staff?.role||'—',
        date:today, time:now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
        type:'out', duration, note:document.getElementById('absenNote').value.trim(),
        createdAt:now.toISOString()
    };
    const arr = getAttendance();
    arr.push(rec);
    saveAttendance(arr);
    AuditLog.add('attendance_out', `Clock out: ${staff?.name||staffId} ${rec.time} (${duration})`);
    document.getElementById('absenNote').value='';
    checkStatus();
    renderTodayActivity();
    showToast(`■ ${staff?.name||'Karyawan'} Clock Out ${rec.time} (${duration})`);
}

function renderTodayActivity(){
    const today = new Date().toISOString().slice(0,10);
    const recs = getAttendance().filter(a=>a.date===today).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    const el = document.getElementById('todayActivity');
    if(!recs.length){ el.innerHTML='<div class="text-sm text-center py-4" style="color:rgba(255,255,255,.3)">Belum ada absensi hari ini</div>'; }
    else el.innerHTML = recs.map(r=>`
        <div class="flex items-center justify-between py-2" style="border-bottom:1px solid rgba(255,255,255,.05)">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold" style="background:${r.type==='in'?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)'};color:${r.type==='in'?'#4ade80':'#f87171'}">${r.type==='in'?'▶':'■'}</div>
                <div>
                    <div class="text-sm font-semibold text-white">${r.staffName}</div>
                    <div class="text-xs" style="color:rgba(255,255,255,.35)">${r.role}</div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-sm font-bold" style="color:${r.type==='in'?'#4ade80':'#f87171'}">${r.time}</div>
                ${r.duration?`<div class="text-xs" style="color:rgba(255,255,255,.3)">${r.duration}</div>`:''}
            </div>
        </div>`).join('');

    // stats
    const staffSet = new Set(recs.filter(r=>r.type==='in').map(r=>r.staffId));
    const outSet   = new Set(recs.filter(r=>r.type==='out').map(r=>r.staffId));
    const onsite   = [...staffSet].filter(id=>!outSet.has(id)).length;
    document.getElementById('statHadir').textContent  = staffSet.size;
    document.getElementById('statOnsite').textContent = onsite;
    document.getElementById('statPulang').textContent = outSet.size;
}

function renderHistory(){
    const month = document.getElementById('monthFilter').value;
    const recs = getAttendance().filter(a=>!month||a.date.startsWith(month));
    const body = document.getElementById('histBody');
    const empty = document.getElementById('histEmpty');
    if(!recs.length){ body.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    const sorted = [...recs].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    body.innerHTML = sorted.map(r=>`
        <div class="px-5 py-3 flex items-center justify-between" style="border-bottom:1px solid rgba(255,255,255,.05)">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl flex items-center justify-center text-sm" style="background:${r.type==='in'?'rgba(16,185,129,.12)':'rgba(239,68,68,.12)'};color:${r.type==='in'?'#4ade80':'#f87171'}">${r.type==='in'?'▶':'■'}</div>
                <div>
                    <div class="text-sm font-semibold text-white">${r.staffName} <span style="color:rgba(255,255,255,.3);font-size:.7rem">${r.role}</span></div>
                    <div class="text-xs" style="color:rgba(255,255,255,.35)">${r.date} · ${r.type==='in'?'Clock In':'Clock Out'}${r.duration?' · '+r.duration:''}</div>
                    ${r.note?`<div class="text-xs italic" style="color:rgba(255,255,255,.25)">${r.note}</div>`:''}
                </div>
            </div>
            <div class="font-bold text-sm" style="color:${r.type==='in'?'#4ade80':'#f87171'}">${r.time}</div>
        </div>`).join('');
}

function showToast(msg, isErr=false){
    const t=document.getElementById('toast');
    t.className='toast '+(isErr?'toast-err':'toast-ok');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
}

document.addEventListener('DOMContentLoaded',()=>{
    const s=SessionManager.get('session');
    if(!s){window.location.href='index.html';return;}
    const outlet=SessionManager.get('outlet');
    if(outlet) document.getElementById('outletLabel').textContent=outlet.name;

    const now=new Date();
    document.getElementById('monthFilter').value=now.toISOString().slice(0,7);

    setInterval(updateClock,1000);
    updateClock();
    populateStaff();
    renderTodayActivity();
});
</script>
</body>
</html>
