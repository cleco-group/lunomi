<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunomi — Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;}
        body{min-height:100vh;background:#020617;background-image:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(99,102,241,.25) 0%,transparent 60%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(59,130,246,.2) 0%,transparent 60%);color:white;overflow-x:hidden;}
        .glass-nav{background:rgba(2,6,23,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);}
        .glass-card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);}
        .input-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:white;}
        .input-glass:focus{outline:none;border-color:rgba(99,102,241,.6);}
        .period-btn{padding:.4rem 1rem;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);}
        .period-btn.active{background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.5);color:white;}
        .row-item{border-bottom:1px solid rgba(255,255,255,.06);}
    </style>
</head>
<body>
<nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-white opacity-50 hover:opacity-100 transition text-lg">←</button>
            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-lg" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">📊</div>
            <div>
                <div class="font-extrabold text-white text-sm">Analytics</div>
                <div class="text-xs" style="color:rgba(255,255,255,.4)" id="outletLabel">—</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button class="period-btn active" onclick="setPeriod(7,this)">7 Hari</button>
            <button class="period-btn" onclick="setPeriod(30,this)">30 Hari</button>
            <button class="period-btn" onclick="setPeriod(90,this)">3 Bulan</button>
        </div>
    </div>
</nav>

<div class="max-w-6xl mx-auto px-4 py-6">

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
        <div class="glass-card rounded-2xl p-4">
            <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Total Pendapatan</div>
            <div class="text-xl font-extrabold text-white" id="kpiRevenue">Rp 0</div>
            <div class="text-xs mt-1 text-green-400" id="kpiRevenueChg"></div>
        </div>
        <div class="glass-card rounded-2xl p-4">
            <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Total Transaksi</div>
            <div class="text-2xl font-extrabold text-white" id="kpiTrx">0</div>
            <div class="text-xs mt-1" style="color:rgba(255,255,255,.4)" id="kpiTrxChg"></div>
        </div>
        <div class="glass-card rounded-2xl p-4">
            <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Rata-rata / Transaksi</div>
            <div class="text-xl font-extrabold text-white" id="kpiAvg">Rp 0</div>
        </div>
        <div class="glass-card rounded-2xl p-4">
            <div class="text-xs mb-1" style="color:rgba(255,255,255,.4)">Customer Unik</div>
            <div class="text-2xl font-extrabold text-indigo-400" id="kpiCust">0</div>
        </div>
    </div>

    <!-- Revenue Chart -->
    <div class="glass-card rounded-2xl p-5 mb-6">
        <div class="font-bold text-white mb-4">Tren Pendapatan Harian</div>
        <div style="height:220px"><canvas id="revenueChart"></canvas></div>
    </div>

    <!-- 2-col -->
    <div class="grid md:grid-cols-2 gap-6 mb-6">
        <!-- Top Products -->
        <div class="glass-card rounded-2xl p-5">
            <div class="font-bold text-white mb-4">🏆 Produk Terlaris</div>
            <div id="topProducts" class="space-y-2"></div>
            <div id="topProductsEmpty" class="hidden text-center py-4 text-sm" style="color:rgba(255,255,255,.3)">Belum ada data transaksi</div>
        </div>
        <!-- Payment Methods -->
        <div class="glass-card rounded-2xl p-5">
            <div class="font-bold text-white mb-4">💳 Metode Pembayaran</div>
            <div style="height:180px" id="payChartWrap"><canvas id="payChart"></canvas></div>
            <div id="payChartEmpty" class="hidden text-center py-4 text-sm" style="color:rgba(255,255,255,.3)">Belum ada data</div>
        </div>
    </div>

    <!-- Peak Hours + Recent -->
    <div class="grid md:grid-cols-2 gap-6">
        <!-- Peak Hours -->
        <div class="glass-card rounded-2xl p-5">
            <div class="font-bold text-white mb-4">⏰ Jam Tersibuk</div>
            <div id="peakHours" class="space-y-2"></div>
            <div id="peakEmpty" class="hidden text-center py-4 text-sm" style="color:rgba(255,255,255,.3)">Belum ada data</div>
        </div>
        <!-- Recent Transactions -->
        <div class="glass-card rounded-2xl p-5">
            <div class="font-bold text-white mb-3">🕐 Transaksi Terbaru</div>
            <div id="recentTrx" class="space-y-2"></div>
            <div id="recentEmpty" class="hidden text-center py-4 text-sm" style="color:rgba(255,255,255,.3)">Belum ada transaksi</div>
        </div>
    </div>

</div>

<script>
let activePeriod = 7;
let revenueChartInst = null;
let payChartInst = null;

function rp(n){ return 'Rp '+Number(n||0).toLocaleString('id-ID'); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'short'}); }

function setPeriod(days, btn){
    activePeriod = days;
    document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function filterTrx(days){
    const now = new Date();
    const cutoff = new Date(now - days * 86400000);
    return LunomiDB.getTransactions().filter(t => new Date(t.createdAt) >= cutoff);
}

function render(){
    const trxs = filterTrx(activePeriod);
    const prevTrxs = filterTrx(activePeriod * 2).filter(t => new Date(t.createdAt) < new Date(new Date() - activePeriod * 86400000));

    // KPIs
    const revenue = trxs.reduce((s,t)=>s+(t.total||0),0);
    const prevRevenue = prevTrxs.reduce((s,t)=>s+(t.total||0),0);
    const revChg = prevRevenue ? Math.round(((revenue-prevRevenue)/prevRevenue)*100) : null;
    document.getElementById('kpiRevenue').textContent = rp(revenue);
    document.getElementById('kpiRevenueChg').textContent = revChg !== null ? (revChg >= 0 ? '▲ '+revChg+'%' : '▼ '+Math.abs(revChg)+'%') + ' vs periode lalu' : '';
    document.getElementById('kpiRevenueChg').style.color = revChg >= 0 ? '#4ade80' : '#f87171';
    document.getElementById('kpiTrx').textContent = trxs.length;
    document.getElementById('kpiAvg').textContent = trxs.length ? rp(Math.round(revenue/trxs.length)) : 'Rp 0';
    const uniqueCust = new Set(trxs.filter(t=>t.customerId).map(t=>t.customerId)).size;
    document.getElementById('kpiCust').textContent = uniqueCust;

    renderRevenueChart(trxs);
    renderTopProducts(trxs);
    renderPayChart(trxs);
    renderPeakHours(trxs);
    renderRecent(trxs);
}

function renderRevenueChart(trxs){
    const days = activePeriod;
    const labels = [], data = [];
    for(let i = days-1; i >= 0; i--){
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        labels.push(fmtDate(key+'T00:00:00'));
        const dayTotal = trxs.filter(t=>t.createdAt&&t.createdAt.slice(0,10)===key).reduce((s,t)=>s+(t.total||0),0);
        data.push(dayTotal);
    }
    if(revenueChartInst) revenueChartInst.destroy();
    const ctx = document.getElementById('revenueChart').getContext('2d');
    revenueChartInst = new Chart(ctx,{
        type:'line',
        data:{ labels, datasets:[{label:'Pendapatan',data,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.1)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#6366f1',fill:true,tension:.3}]},
        options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
            x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},
            y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:10},callback:v=>v>=1000000?'Rp '+(v/1000000).toFixed(1)+'Jt':v>=1000?'Rp '+(v/1000).toFixed(0)+'K':'Rp '+v},grid:{color:'rgba(255,255,255,.05)'}}
        }}
    });
}

function renderTopProducts(trxs){
    const map = {};
    trxs.forEach(t=>(t.items||[]).forEach(it=>{ if(!map[it.name]) map[it.name]={qty:0,rev:0}; map[it.name].qty+=it.qty; map[it.name].rev+=it.price*it.qty; }));
    const top = Object.entries(map).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
    const maxQty = top.length ? top[0][1].qty : 1;
    const el = document.getElementById('topProducts');
    const empty = document.getElementById('topProductsEmpty');
    if(!top.length){ el.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    el.innerHTML = top.map(([name,d],i)=>`
        <div class="flex items-center gap-3">
            <span class="text-xs font-bold w-5 text-center" style="color:rgba(255,255,255,.3)">${i+1}</span>
            <div class="flex-1">
                <div class="flex justify-between text-sm mb-1"><span class="text-white font-semibold">${name}</span><span class="text-indigo-400">${d.qty}x</span></div>
                <div class="h-1.5 rounded-full" style="background:rgba(255,255,255,.08)"><div class="h-1.5 rounded-full" style="width:${Math.round(d.qty/maxQty*100)}%;background:linear-gradient(90deg,#6366f1,#4f46e5)"></div></div>
            </div>
            <span class="text-xs font-semibold" style="color:rgba(255,255,255,.5)">${rp(d.rev)}</span>
        </div>`).join('');
}

function renderPayChart(trxs){
    const map = {};
    trxs.forEach(t=>{ const m=t.payMethod||'Lainnya'; map[m]=(map[m]||0)+1; });
    const keys=Object.keys(map), vals=Object.values(map);
    const wrap=document.getElementById('payChartWrap');
    const empty=document.getElementById('payChartEmpty');
    if(!keys.length){ wrap.style.display='none'; empty.classList.remove('hidden'); return; }
    wrap.style.display=''; empty.classList.add('hidden');
    if(payChartInst) payChartInst.destroy();
    const ctx=document.getElementById('payChart').getContext('2d');
    payChartInst=new Chart(ctx,{
        type:'doughnut',
        data:{labels:keys,datasets:[{data:vals,backgroundColor:['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'],borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'rgba(255,255,255,.7)',font:{size:11},boxWidth:12}}}}
    });
}

function renderPeakHours(trxs){
    const map = {};
    trxs.forEach(t=>{ const h=new Date(t.createdAt).getHours(); map[h]=(map[h]||0)+1; });
    const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const maxVal=sorted.length?sorted[0][1]:1;
    const el=document.getElementById('peakHours');
    const empty=document.getElementById('peakEmpty');
    if(!sorted.length){ el.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    el.innerHTML=sorted.map(([h,cnt])=>`
        <div class="flex items-center gap-3 text-sm">
            <span class="w-16 font-semibold text-white">${String(h).padStart(2,'0')}:00</span>
            <div class="flex-1 h-2 rounded-full" style="background:rgba(255,255,255,.08)"><div class="h-2 rounded-full" style="width:${Math.round(cnt/maxVal*100)}%;background:linear-gradient(90deg,#f59e0b,#d97706)"></div></div>
            <span class="text-xs" style="color:rgba(255,255,255,.4)">${cnt} trx</span>
        </div>`).join('');
}

function renderRecent(trxs){
    const el=document.getElementById('recentTrx');
    const empty=document.getElementById('recentEmpty');
    const recent=trxs.slice(0,8);
    if(!recent.length){ el.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    el.innerHTML=recent.map(t=>{
        const cust=t.customerId?LunomiDB.findCustomer(t.customerId):null;
        return `<div class="flex justify-between items-center py-2" style="border-bottom:1px solid rgba(255,255,255,.06)">
            <div><div class="text-sm font-semibold text-white">${cust?cust.name:'Umum'}</div><div class="text-xs mt-0.5" style="color:rgba(255,255,255,.4)">${new Date(t.createdAt).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${t.payMethod||'—'}</div></div>
            <div class="font-bold text-white">${rp(t.total)}</div>
        </div>`;
    }).join('');
}

document.addEventListener('DOMContentLoaded',()=>{
    const s=SessionManager.get('session');
    if(!s){ window.location.href='index.html'; return; }
    const outlet=SessionManager.get('outlet');
    if(outlet) document.getElementById('outletLabel').textContent=outlet.name;
    render();
});
</script>
</body>
</html>
