<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunomi — Master Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;}
        body{min-height:100vh;background:#020617;background-image:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(99,102,241,.25) 0%,transparent 60%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(16,185,129,.12) 0%,transparent 60%);color:white;overflow-x:hidden;}
        .glass-nav{background:rgba(2,6,23,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);}
        .glass-card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);}
        .input-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:white;outline:none;}
        .input-glass::placeholder{color:rgba(255,255,255,.3);}
        .input-glass:focus{border-color:rgba(99,102,241,.6);}
        .btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;font-weight:700;cursor:pointer;border:none;transition:all .2s;}
        .btn-primary:hover{transform:translateY(-1px);}
        .prod-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:1rem;transition:all .2s;cursor:pointer;position:relative;}
        .prod-card:hover{background:rgba(255,255,255,.08);border-color:rgba(99,102,241,.3);transform:translateY(-2px);}
        .cat-btn{padding:.4rem .9rem;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);transition:all .2s;background:transparent;}
        .cat-btn.active{background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.6);color:white;}
        .modal-overlay{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);}
        .modal-box{background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:1.25rem;}
        .toggle{width:2.5rem;height:1.25rem;border-radius:999px;position:relative;cursor:pointer;transition:background .2s;}
        .toggle.on{background:#6366f1;} .toggle.off{background:rgba(255,255,255,.15);}
        .toggle::after{content:'';position:absolute;width:.9rem;height:.9rem;border-radius:50%;background:white;top:50%;transform:translateY(-50%);transition:left .2s;}
        .toggle.on::after{left:calc(100% - .95rem);} .toggle.off::after{left:.15rem;}
        .toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.75rem 1.25rem;border-radius:1rem;font-size:.85rem;font-weight:600;z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s;pointer-events:none;}
        .toast.show{transform:translateY(0);opacity:1;}
        .toast-ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
        @media(max-width:768px){input,select,textarea{font-size:16px!important;}}
    </style>
</head>
<body>
<nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-white opacity-50 hover:opacity-100 transition text-lg">←</button>
            <div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#6366f1,#4f46e5)"><span>🍽️</span></div>
            <div>
                <div class="font-extrabold text-white text-sm">Master Menu</div>
                <div class="text-xs" id="outletLabel" style="color:rgba(255,255,255,.4)">—</div>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="text-xs px-3 py-2 rounded-xl" style="background:rgba(255,255,255,.06);color:rgba(255,255,255,.4)"><span id="statCount">0</span> menu · <span class="text-green-400" id="statAvail">0</span> tersedia</div>
            <button onclick="openModal()" class="btn-primary px-4 py-2 rounded-xl text-xs">+ Tambah Menu</button>
        </div>
    </div>
</nav>

<div class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex flex-wrap gap-3 items-center mb-5">
        <input id="searchInput" type="text" placeholder="🔍 Cari menu..." class="input-glass px-4 py-2 rounded-xl text-sm flex-1 min-w-[180px]" oninput="renderGrid()">
        <div class="flex gap-2 flex-wrap" id="catFilters"></div>
    </div>
    <div id="prodGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    <div id="emptyState" class="hidden py-16 text-center text-sm" style="color:rgba(255,255,255,.3)">
        <div class="text-4xl mb-3">🍽️</div>
        Tidak ada menu ditemukan. <a onclick="openModal()" class="text-indigo-400 cursor-pointer">Tambah menu baru</a>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="prodModal" class="modal-overlay hidden fixed inset-0 flex items-center justify-center z-50 p-4">
    <div class="modal-box w-full max-w-md shadow-2xl">
        <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid rgba(255,255,255,.08)">
            <h2 id="modalTitle" class="font-bold text-white">Tambah Menu</h2>
            <button onclick="closeModal()" style="color:rgba(255,255,255,.4)" class="hover:text-white text-xl font-bold">×</button>
        </div>
        <div class="px-6 py-5 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">Nama Menu *</label>
                    <input id="pName" type="text" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm" placeholder="cth: Nasi Goreng Spesial">
                </div>
                <div>
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">Kategori</label>
                    <select id="pCat" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm">
                        <option>Makanan</option><option>Minuman</option><option>Snack</option><option>Dessert</option><option>Paket</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">Emoji / Icon</label>
                    <input id="pEmoji" type="text" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm text-center text-2xl" placeholder="🍛" maxlength="4">
                </div>
                <div>
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">Harga Jual (Rp) *</label>
                    <input id="pPrice" type="number" min="0" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm" placeholder="0" inputmode="numeric">
                </div>
                <div>
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">Harga Modal (Rp)</label>
                    <input id="pCost" type="number" min="0" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm" placeholder="0" inputmode="numeric">
                </div>
                <div class="col-span-2">
                    <label class="text-xs font-semibold mb-1.5 block" style="color:rgba(255,255,255,.5)">SKU / Kode Barcode</label>
                    <input id="pSku" type="text" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm" placeholder="cth: MENU-001">
                </div>
                <div class="col-span-2 flex items-center justify-between py-1">
                    <span class="text-xs font-semibold" style="color:rgba(255,255,255,.5)">Status Tersedia</span>
                    <div id="availToggle" class="toggle on" onclick="toggleAvail()"></div>
                </div>
            </div>
            <div id="pErr" class="hidden px-3 py-2 rounded-xl text-xs" style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;"></div>
        </div>
        <div class="px-6 pb-5 flex gap-3">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7)">Batal</button>
            <button onclick="saveProduct()" class="btn-primary flex-1 py-2.5 rounded-xl text-sm">Simpan</button>
        </div>
    </div>
</div>

<div id="toast" class="toast toast-ok"></div>

<script>
const DEFAULT_PRODUCTS = [
    {id:1,  name:'Nasi Goreng',    cat:'Makanan', price:22000, cost:8000,  emoji:'🍳', sku:'MENU-001', avail:true},
    {id:2,  name:'Mie Ayam',       cat:'Makanan', price:18000, cost:6000,  emoji:'🍜', sku:'MENU-002', avail:true},
    {id:3,  name:'Soto Ayam',      cat:'Makanan', price:20000, cost:7000,  emoji:'🥘', sku:'MENU-003', avail:true},
    {id:4,  name:'Ayam Bakar',     cat:'Makanan', price:28000, cost:10000, emoji:'🍗', sku:'MENU-004', avail:true},
    {id:5,  name:'Es Teh Manis',   cat:'Minuman', price:8000,  cost:2000,  emoji:'🧊', sku:'MENU-005', avail:true},
    {id:6,  name:'Es Jeruk',       cat:'Minuman', price:10000, cost:3000,  emoji:'🍊', sku:'MENU-006', avail:true},
    {id:7,  name:'Jus Alpukat',    cat:'Minuman', price:15000, cost:5000,  emoji:'🥑', sku:'MENU-007', avail:true},
    {id:8,  name:'Kentang Goreng', cat:'Snack',   price:12000, cost:4000,  emoji:'🍟', sku:'MENU-008', avail:true},
    {id:9,  name:'Pisang Goreng',  cat:'Snack',   price:10000, cost:3000,  emoji:'🍌', sku:'MENU-009', avail:false},
    {id:10, name:'Es Krim Vanilla',cat:'Dessert', price:14000, cost:5000,  emoji:'🍦', sku:'MENU-010', avail:true},
];

const CATS = ['Semua','Makanan','Minuman','Snack','Dessert','Paket'];
let activeCat = 'Semua', editingId = null, isAvail = true;

function rp(n){ return 'Rp '+Number(n||0).toLocaleString('id-ID'); }

function getProducts(){
    const stored = localStorage.getItem('lunomi_products');
    if(stored) return JSON.parse(stored);
    localStorage.setItem('lunomi_products', JSON.stringify(DEFAULT_PRODUCTS));
    return DEFAULT_PRODUCTS;
}
function saveProducts(arr){ localStorage.setItem('lunomi_products', JSON.stringify(arr)); }

function initFilters(){
    document.getElementById('catFilters').innerHTML = CATS.map(c=>`
        <button class="cat-btn${c==='Semua'?' active':''}" onclick="setCat('${c}',this)">${c}</button>`).join('');
}

function setCat(c, btn){
    activeCat=c;
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
}

function updateStats(products){
    document.getElementById('statCount').textContent = products.length;
    document.getElementById('statAvail').textContent = products.filter(p=>p.avail!==false).length;
}

function renderGrid(){
    const q = document.getElementById('searchInput').value.toLowerCase();
    const products = getProducts();
    const filtered = products.filter(p=>(activeCat==='Semua'||p.cat===activeCat)&&(!q||p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)));
    const grid = document.getElementById('prodGrid');
    const empty = document.getElementById('emptyState');

    updateStats(products);

    if(!filtered.length){ grid.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    grid.innerHTML = filtered.map(p=>{
        const margin = p.cost ? Math.round(((p.price-p.cost)/p.price)*100) : null;
        return `<div class="prod-card p-4" onclick="editProduct(${p.id})">
            ${!p.avail?'<div class="absolute top-2 right-2 text-xs px-2 py-0.5 rounded-full font-bold" style="background:rgba(239,68,68,.15);color:#f87171">Habis</div>':''}
            <div class="text-3xl mb-2">${p.emoji||'🍽️'}</div>
            <div class="font-bold text-white text-xs mb-0.5 leading-tight">${p.name}</div>
            <div class="text-xs mb-2" style="color:rgba(255,255,255,.35)">${p.cat}</div>
            <div class="font-extrabold text-indigo-400 text-sm">${rp(p.price)}</div>
            ${margin!==null?`<div class="text-xs mt-0.5 text-green-400">Margin ${margin}%</div>`:''}
            ${p.sku?`<div class="text-xs mt-1 font-mono" style="color:rgba(255,255,255,.2)">${p.sku}</div>`:''}
        </div>`;
    }).join('');
}

function toggleAvail(){ isAvail=!isAvail; document.getElementById('availToggle').className=`toggle ${isAvail?'on':'off'}`; }

function openModal(id){
    editingId=id||null; isAvail=true;
    ['pName','pPrice','pCost','pEmoji','pSku'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('pCat').value='Makanan';
    document.getElementById('availToggle').className='toggle on';
    document.getElementById('pErr').classList.add('hidden');
    document.getElementById('modalTitle').textContent='Tambah Menu';
    document.getElementById('prodModal').classList.remove('hidden');
    document.getElementById('pName').focus();
}

function editProduct(id){
    const products=getProducts();
    const p=products.find(x=>x.id===id);
    if(!p) return;
    editingId=id; isAvail=p.avail!==false;
    document.getElementById('modalTitle').textContent='Edit Menu';
    document.getElementById('pName').value  = p.name;
    document.getElementById('pCat').value   = p.cat;
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pCost').value  = p.cost||'';
    document.getElementById('pEmoji').value = p.emoji||'';
    document.getElementById('pSku').value   = p.sku||'';
    document.getElementById('availToggle').className=`toggle ${isAvail?'on':'off'}`;
    document.getElementById('pErr').classList.add('hidden');
    document.getElementById('prodModal').classList.remove('hidden');
}

function closeModal(){ document.getElementById('prodModal').classList.add('hidden'); }

function saveProduct(){
    const name  = document.getElementById('pName').value.trim();
    const price = parseInt(document.getElementById('pPrice').value)||0;
    const cost  = parseInt(document.getElementById('pCost').value)||0;
    const err   = document.getElementById('pErr');
    if(!name){ err.textContent='Nama menu harus diisi.'; err.classList.remove('hidden'); return; }
    if(price<1){ err.textContent='Harga harus lebih dari 0.'; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');

    const data = {
        name, cat:document.getElementById('pCat').value,
        price, cost,
        emoji:document.getElementById('pEmoji').value||'🍽️',
        sku:document.getElementById('pSku').value.trim(),
        avail:isAvail
    };

    const products=getProducts();
    if(editingId){
        const idx=products.findIndex(p=>p.id===editingId);
        if(idx>=0) products[idx]={...products[idx],...data};
        AuditLog.add('product_edit', `Edit menu: ${name} ${rp(price)}`);
    } else {
        products.unshift({id:Date.now(),...data});
        AuditLog.add('product_add', `Tambah menu: ${name} ${rp(price)}`);
    }
    saveProducts(products);
    closeModal();
    renderGrid();
    showToast(editingId?'✏️ Menu diperbarui':'✅ Menu ditambahkan');
}

function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('DOMContentLoaded',()=>{
    const s=SessionManager.get('session');
    if(!s){window.location.href='index.html';return;}
    const outlet=SessionManager.get('outlet');
    if(outlet) document.getElementById('outletLabel').textContent=outlet.name;
    initFilters();
    renderGrid();
});
</script>
</body>
</html>
