<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Meja — Lunomi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;}
        body{min-height:100vh;background:#020617;background-image:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(34,197,94,.15) 0%,transparent 60%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(99,102,241,.1) 0%,transparent 60%);color:white;overflow-x:hidden;}
        .glass-nav{background:rgba(2,6,23,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);}
        .glass-card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);}
        .input-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;}
        .input-glass::placeholder{color:rgba(255,255,255,.35);}
        .input-glass:focus{outline:none;border-color:rgba(99,102,241,.7);box-shadow:0 0 0 3px rgba(99,102,241,.15);}
        .table-card{border-radius:1rem;cursor:pointer;transition:all .2s;text-align:center;padding:1.1rem .6rem;}
        .table-card:hover{transform:scale(1.06);}
        .t-available{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
        .t-occupied{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#f87171;}
        .t-reserved{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24;}
        .t-cleaning{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;}
        @media(max-width:768px){input,select,textarea{font-size:16px!important;}}
    </style>
</head>
<body>
<nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
        <button onclick="window.location.href='dashboard.html'" class="text-white opacity-50 hover:opacity-100 transition text-lg">←</button>
        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-lg" style="background:linear-gradient(135deg,#059669,#047857)">🍽️</div>
        <div>
            <div class="font-extrabold text-white text-sm">Manajemen Meja</div>
            <div class="text-xs" id="outletLabel" style="color:rgba(255,255,255,.4)">-</div>
        </div>
        <button onclick="openAddTable()" class="ml-auto px-4 py-2 rounded-xl text-xs font-bold text-white" style="background:linear-gradient(135deg,#059669,#047857)">+ Tambah Meja</button>
    </div>
</nav>

<div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5" id="statsRow"></div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-4 mb-4 text-xs font-bold text-white/50">
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Tersedia</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>Terisi</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Reservasi</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-violet-500"></span>Dibersihkan</div>
    </div>

    <!-- Table Grid -->
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4 mb-8" id="tableGrid"></div>

    <!-- Waitlist -->
    <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-white/5 flex justify-between items-center">
            <h3 class="font-bold text-sm">Daftar Tunggu (Waitlist)</h3>
            <button onclick="openAddWait()" class="px-3 py-1.5 rounded-xl text-xs font-bold" style="background:rgba(99,102,241,.2);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)">+ Tambah</button>
        </div>
        <div id="waitlistBody"></div>
    </div>
</div>

<!-- Table Action Modal -->
<div id="tableModal" style="display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="rounded-2xl p-6 w-full max-w-sm shadow-2xl" style="background:#0f172a;border:1px solid rgba(255,255,255,.1)">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold" id="tableModalTitle">Meja</h3>
            <button onclick="closeTableModal()" class="text-white/40 hover:text-white text-xl">✕</button>
        </div>
        <div id="tableModalBody" class="space-y-2.5"></div>
    </div>
</div>

<!-- Add Table Modal -->
<div id="addTableModal" style="display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="rounded-2xl p-6 w-full max-w-sm shadow-2xl" style="background:#0f172a;border:1px solid rgba(255,255,255,.1)">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Tambah Meja</h3>
            <button onclick="closeAddTable()" class="text-white/40 hover:text-white text-xl">✕</button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">Nomor Meja *</label>
                <input id="tNum" type="text" class="input-glass w-full px-3 py-2 rounded-xl text-sm" placeholder="Contoh: T-07, VIP-01">
            </div>
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">Kapasitas (Kursi)</label>
                <input id="tCap" type="number" min="1" max="30" value="4" class="input-glass w-full px-3 py-2 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">Lokasi</label>
                <input id="tLoc" type="text" class="input-glass w-full px-3 py-2 rounded-xl text-sm" placeholder="Indoor, Outdoor, VIP…">
            </div>
        </div>
        <div class="flex gap-3 mt-5">
            <button onclick="closeAddTable()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)">Batal</button>
            <button onclick="addTable()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style="background:linear-gradient(135deg,#059669,#047857)">Tambah</button>
        </div>
    </div>
</div>

<!-- Waitlist Add Modal -->
<div id="addWaitModal" style="display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="rounded-2xl p-6 w-full max-w-sm shadow-2xl" style="background:#0f172a;border:1px solid rgba(255,255,255,.1)">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Tambah ke Waitlist</h3>
            <button onclick="closeAddWait()" class="text-white/40 hover:text-white text-xl">✕</button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">Nama *</label>
                <input id="wName" type="text" class="input-glass w-full px-3 py-2 rounded-xl text-sm" placeholder="Nama pelanggan">
            </div>
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">Jumlah Orang</label>
                <input id="wPax" type="number" min="1" max="50" value="2" class="input-glass w-full px-3 py-2 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-xs font-semibold text-white/40 mb-1 block">No. HP</label>
                <input id="wPhone" type="tel" class="input-glass w-full px-3 py-2 rounded-xl text-sm" placeholder="08xxxxxxxxxx">
            </div>
        </div>
        <div class="flex gap-3 mt-5">
            <button onclick="closeAddWait()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)">Batal</button>
            <button onclick="addToWaitlist()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">Tambah</button>
        </div>
    </div>
</div>

<script>
const TABLES_KEY='lunomi_tables', WAITLIST_KEY='lunomi_waitlist';
const DEFAULT_TABLES=[
    {id:'T-01',cap:4,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-02',cap:2,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-03',cap:6,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-04',cap:4,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-05',cap:4,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-06',cap:8,loc:'Indoor',status:'available',since:null,reservedFor:null},
    {id:'T-07',cap:4,loc:'Outdoor',status:'available',since:null,reservedFor:null},
    {id:'T-08',cap:4,loc:'Outdoor',status:'available',since:null,reservedFor:null},
    {id:'VIP-01',cap:10,loc:'VIP',status:'available',since:null,reservedFor:null},
    {id:'VIP-02',cap:8,loc:'VIP',status:'available',since:null,reservedFor:null},
];

function getTables(){const s=localStorage.getItem(TABLES_KEY);if(!s){saveTables(DEFAULT_TABLES);return DEFAULT_TABLES;}return JSON.parse(s);}
function saveTables(arr){localStorage.setItem(TABLES_KEY,JSON.stringify(arr));}
function getWaitlist(){return JSON.parse(localStorage.getItem(WAITLIST_KEY)||'[]');}
function saveWaitlist(arr){localStorage.setItem(WAITLIST_KEY,JSON.stringify(arr));}

function elapsedSince(iso){
    const mins=Math.floor((Date.now()-new Date(iso).getTime())/60000);
    return mins<60?`${mins}m`:`${Math.floor(mins/60)}j ${mins%60}m`;
}

function statusCls(st){return{available:'t-available',occupied:'t-occupied',reserved:'t-reserved',cleaning:'t-cleaning'}[st]||'t-available';}
function statusLabel(st){return{available:'Tersedia',occupied:'Terisi',reserved:'Reservasi',cleaning:'Dibersihkan'}[st]||st;}

function renderStats(){
    const tables=getTables();
    const s=[
        {label:'Total Meja',val:tables.length,color:'rgba(255,255,255,.8)'},
        {label:'Tersedia',val:tables.filter(t=>t.status==='available').length,color:'#4ade80'},
        {label:'Terisi',val:tables.filter(t=>t.status==='occupied').length,color:'#f87171'},
        {label:'Reservasi',val:tables.filter(t=>t.status==='reserved').length,color:'#fbbf24'},
    ];
    document.getElementById('statsRow').innerHTML=s.map(x=>`
        <div class="glass-card rounded-2xl p-4">
            <p class="text-xs text-white/40 mb-1">${x.label}</p>
            <p class="text-2xl font-black" style="color:${x.color}">${x.val}</p>
        </div>`).join('');
}

function renderGrid(){
    const tables=getTables();
    document.getElementById('tableGrid').innerHTML=tables.map(t=>{
        const cls=statusCls(t.status);
        const sinceEl=t.since&&t.status==='occupied'?`<p class="text-[9px] mt-0.5 opacity-60">${elapsedSince(t.since)}</p>`:'';
        const resEl=t.reservedFor&&t.status==='reserved'?`<p class="text-[9px] mt-0.5 opacity-70 truncate">${t.reservedFor}</p>`:'';
        return `<div class="table-card ${cls}" onclick="openTableModal('${t.id}')">
            <div class="text-xl mb-0.5">${{available:'✓',occupied:'●',reserved:'🕐',cleaning:'🧹'}[t.status]||'?'}</div>
            <div class="font-black text-sm">${t.id}</div>
            <div class="text-[9px] font-bold opacity-60">${t.cap} Kursi</div>
            ${t.loc?`<div class="text-[8px] opacity-40">${t.loc}</div>`:''}
            ${sinceEl}${resEl}
        </div>`;
    }).join('');
}

function renderWaitlist(){
    const list=getWaitlist();
    const el=document.getElementById('waitlistBody');
    if(!list.length){el.innerHTML=`<p class="py-8 text-center text-white/25 text-sm">Tidak ada antrian</p>`;return;}
    el.innerHTML=`<table class="w-full text-left"><thead><tr class="text-[10px] font-bold uppercase text-white/30 bg-white/5">
        <th class="px-4 py-3">No.</th><th class="px-4 py-3">Nama</th>
        <th class="px-4 py-3 text-center">Tamu</th><th class="px-4 py-3">Tunggu</th>
        <th class="px-4 py-3 text-right">Aksi</th></tr></thead>
        <tbody class="divide-y divide-white/5">
        ${list.map((w,i)=>`<tr class="hover:bg-white/5 transition">
            <td class="px-4 py-3 font-black text-indigo-400">#${String(i+1).padStart(2,'0')}</td>
            <td class="px-4 py-3"><div class="font-bold text-sm">${w.name}</div>${w.phone?`<div class="text-xs text-white/35">${w.phone}</div>`:''}</td>
            <td class="px-4 py-3 text-center text-sm font-bold">${w.pax}</td>
            <td class="px-4 py-3 text-xs text-white/40">${elapsedSince(w.addedAt)}</td>
            <td class="px-4 py-3 text-right">
                <div class="flex gap-2 justify-end">
                    <button onclick="callWaitlist('${w.id}')" class="px-2 py-1 rounded-lg text-[10px] font-bold" style="background:rgba(34,197,94,.15);color:#6ee7b7;border:1px solid rgba(34,197,94,.25)">Panggil</button>
                    <button onclick="removeWaitlist('${w.id}')" class="px-2 py-1 rounded-lg text-[10px] font-bold" style="background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.2)">✕</button>
                </div>
            </td>
        </tr>`).join('')}
        </tbody></table>`;
}

function openTableModal(id){
    const t=getTables().find(x=>x.id===id);
    if(!t) return;
    document.getElementById('tableModalTitle').textContent=`Meja ${t.id} — ${statusLabel(t.status)}`;
    let body=`<p class="text-xs text-white/40 mb-3">${t.cap} Kursi &bull; ${t.loc||'Indoor'}</p>`;
    if(t.status==='available'){
        body+=`<button onclick="setStatus('${id}','occupied')" class="w-full py-2.5 rounded-xl text-sm font-bold mb-2" style="background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3)">🍽️ Duduki (Dine In)</button>
        <div class="space-y-2"><input id="reserveName" type="text" placeholder="Nama reservasi" class="input-glass w-full px-3 py-2 rounded-xl text-sm">
        <button onclick="setStatus('${id}','reserved')" class="w-full py-2.5 rounded-xl text-sm font-bold" style="background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.3)">🕐 Reservasi</button></div>`;
    } else if(t.status==='occupied'){
        body+=`<p class="text-xs text-white/40 mb-3">Terisi sejak: ${t.since?elapsedSince(t.since)+' lalu':'-'}</p>
        <button onclick="setStatus('${id}','cleaning')" class="w-full py-2.5 rounded-xl text-sm font-bold mb-2" style="background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)">🧹 Selesai — Bersihkan</button>
        <button onclick="setStatus('${id}','available')" class="w-full py-2.5 rounded-xl text-sm font-bold" style="background:rgba(34,197,94,.15);color:#6ee7b7;border:1px solid rgba(34,197,94,.25)">✓ Langsung Tersedia</button>`;
    } else if(t.status==='reserved'){
        body+=(t.reservedFor?`<p class="text-xs text-amber-300 mb-3">Untuk: ${t.reservedFor}</p>`:'');
        body+=`<button onclick="setStatus('${id}','occupied')" class="w-full py-2.5 rounded-xl text-sm font-bold mb-2" style="background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3)">🍽️ Check In</button>
        <button onclick="setStatus('${id}','available')" class="w-full py-2.5 rounded-xl text-sm font-bold" style="background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)">✕ Batalkan Reservasi</button>`;
    } else if(t.status==='cleaning'){
        body+=`<button onclick="setStatus('${id}','available')" class="w-full py-2.5 rounded-xl text-sm font-bold" style="background:rgba(34,197,94,.2);color:#6ee7b7;border:1px solid rgba(34,197,94,.3)">✓ Selesai Dibersihkan</button>`;
    }
    body+=`<button onclick="deleteTable('${id}')" class="w-full py-2 rounded-xl text-xs font-semibold mt-4" style="background:rgba(239,68,68,.06);color:rgba(239,68,68,.45);border:1px solid rgba(239,68,68,.12)">Hapus Meja Ini</button>`;
    document.getElementById('tableModalBody').innerHTML=body;
    document.getElementById('tableModal').style.display='flex';
}

function closeTableModal(){document.getElementById('tableModal').style.display='none';}

function setStatus(id,newStatus){
    const tables=getTables();
    const t=tables.find(x=>x.id===id);
    if(!t) return;
    const old=t.status;
    t.status=newStatus;
    t.since=newStatus==='occupied'?new Date().toISOString():null;
    if(newStatus==='reserved') t.reservedFor=document.getElementById('reserveName')?.value.trim()||'';
    else t.reservedFor=null;
    saveTables(tables);
    const staff=SessionManager.get('session')?.name||'Staff';
    AuditLog.add('table_status',`${staff}: Meja ${id} ${old}→${newStatus}`);
    closeTableModal();
    render();
}

function deleteTable(id){
    if(!confirm(`Hapus meja ${id}?`)) return;
    saveTables(getTables().filter(t=>t.id!==id));
    AuditLog.add('table_delete',`Meja ${id} dihapus`);
    closeTableModal();
    render();
}

function openAddTable(){document.getElementById('tNum').value='';document.getElementById('tCap').value='4';document.getElementById('tLoc').value='';document.getElementById('addTableModal').style.display='flex';}
function closeAddTable(){document.getElementById('addTableModal').style.display='none';}

function addTable(){
    const num=document.getElementById('tNum').value.trim().toUpperCase();
    const cap=parseInt(document.getElementById('tCap').value)||4;
    const loc=document.getElementById('tLoc').value.trim();
    if(!num){alert('Nomor meja harus diisi');return;}
    const tables=getTables();
    if(tables.find(t=>t.id===num)){alert('Nomor meja sudah ada');return;}
    tables.push({id:num,cap,loc,status:'available',since:null,reservedFor:null});
    saveTables(tables);
    AuditLog.add('table_add',`Meja ${num} (${cap} kursi${loc?' - '+loc:''}) ditambahkan`);
    closeAddTable();
    render();
}

function openAddWait(){document.getElementById('wName').value='';document.getElementById('wPax').value='2';document.getElementById('wPhone').value='';document.getElementById('addWaitModal').style.display='flex';}
function closeAddWait(){document.getElementById('addWaitModal').style.display='none';}

function addToWaitlist(){
    const name=document.getElementById('wName').value.trim();
    const pax=parseInt(document.getElementById('wPax').value)||2;
    const phone=document.getElementById('wPhone').value.trim();
    if(!name){alert('Nama harus diisi');return;}
    const list=getWaitlist();
    list.push({id:'W-'+Date.now(),name,pax,phone,addedAt:new Date().toISOString()});
    saveWaitlist(list);
    AuditLog.add('waitlist_add',`${name} (${pax} org) ditambah ke waitlist`);
    closeAddWait();
    renderWaitlist();
}

function callWaitlist(id){
    const list=getWaitlist();
    const w=list.find(x=>x.id===id);
    if(!w) return;
    if(w.phone){
        const msg=`Halo *${w.name}*! Meja Anda sudah siap. Silakan masuk 🙏`;
        window.open(`https://wa.me/${w.phone.replace(/^0/,'62')}?text=${encodeURIComponent(msg)}`,'_blank');
    } else {
        alert(`Panggil: ${w.name} (${w.pax} orang)`);
    }
    saveWaitlist(list.filter(x=>x.id!==id));
    AuditLog.add('waitlist_call',`${w.name} dipanggil dari waitlist`);
    renderWaitlist();
}

function removeWaitlist(id){
    if(!confirm('Hapus dari daftar tunggu?')) return;
    saveWaitlist(getWaitlist().filter(x=>x.id!==id));
    renderWaitlist();
}

function render(){renderStats();renderGrid();renderWaitlist();}

setInterval(()=>renderGrid(),60000);

document.addEventListener('DOMContentLoaded',()=>{
    try{
        const s=SessionManager.get('session');
        if(!s){window.location.href='index.html';return;}
        const outlet=SessionManager.get('outlet');
        document.getElementById('outletLabel').textContent=outlet?.name||'Semua Outlet';
    } catch(e){window.location.href='index.html';}
    render();
});
</script>
</body>
</html>
