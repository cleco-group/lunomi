<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business - Lunomi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: white; min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: white; }
        .glass-input:focus { outline: none; border-color: rgba(34,197,94,0.5); background: rgba(255,255,255,0.08); }
        .glass-input option { background: #1e293b; }
        .tpl-card { cursor: pointer; transition: all 0.2s; }
        .tpl-card:hover { background: rgba(255,255,255,0.08); }
        .tpl-card.active { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.08); }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold">WhatsApp Business</h1>
                <p class="text-sm text-white/50">Konfigurasi nomor dan template pesan WhatsApp</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 rounded-xl glass-card text-sm font-semibold">Kembali</button>
        </div>

        <div class="space-y-6">
            <!-- Nomor WA -->
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-emerald-400">phone</span> Nomor WhatsApp Bisnis
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">Nomor WA Outlet *</label>
                        <div class="flex gap-2">
                            <span class="glass-input px-3 py-2 rounded-xl text-sm text-white/60 shrink-0">+62</span>
                            <input type="tel" id="waNumber" class="glass-input flex-1 px-4 py-2 rounded-xl text-sm" placeholder="81234567890">
                        </div>
                        <p class="text-xs text-white/30 mt-1">Tanpa angka 0 di awal, tanpa spasi/strip</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">Nama Bisnis WA</label>
                        <input type="text" id="waName" class="glass-input w-full px-4 py-2 rounded-xl text-sm" placeholder="Lunomi Restoran">
                    </div>
                </div>
                <div class="mt-4 flex gap-3">
                    <button onclick="testWA()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-xl text-xs font-bold transition flex items-center gap-2">
                        <span class="material-symbols-outlined text-sm">send</span> Test Kirim WA
                    </button>
                </div>
            </div>

            <!-- Template Pesan -->
            <div class="glass-card rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-400">chat</span> Template Pesan
                    </h3>
                    <button onclick="addTemplate()" class="px-3 py-1.5 glass-card hover:bg-white/10 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">add</span> Tambah
                    </button>
                </div>
                <p class="text-xs text-white/30 mb-4">Gunakan variabel: <code class="bg-white/10 px-1 rounded">{nama}</code> <code class="bg-white/10 px-1 rounded">{total}</code> <code class="bg-white/10 px-1 rounded">{tanggal}</code> <code class="bg-white/10 px-1 rounded">{outlet}</code></p>
                <div id="templateList" class="space-y-3"></div>
            </div>

            <!-- Notifikasi Otomatis -->
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-orange-400">notifications</span> Notifikasi Otomatis
                </h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Konfirmasi Booking</p>
                            <p class="text-xs text-white/40">Kirim WA saat reservasi dikonfirmasi</p>
                        </div>
                        <input type="checkbox" id="notifBooking" class="w-4 h-4 accent-emerald-500">
                    </label>
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Struk Digital</p>
                            <p class="text-xs text-white/40">Kirim struk ke pelanggan setelah transaksi</p>
                        </div>
                        <input type="checkbox" id="notifReceipt" class="w-4 h-4 accent-emerald-500">
                    </label>
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Reminder Pesanan Siap</p>
                            <p class="text-xs text-white/40">Notif WA ketika pesanan siap diambil</p>
                        </div>
                        <input type="checkbox" id="notifReady" class="w-4 h-4 accent-emerald-500">
                    </label>
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Promo & Broadcast</p>
                            <p class="text-xs text-white/40">Aktifkan fitur broadcast ke customer</p>
                        </div>
                        <input type="checkbox" id="notifPromo" class="w-4 h-4 accent-emerald-500">
                    </label>
                </div>
            </div>

            <!-- Tombol -->
            <div class="flex justify-end">
                <button onclick="saveWA()" class="px-8 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-sm font-bold transition shadow-lg shadow-emerald-500/20">
                    Simpan Pengaturan
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">check_circle</span>
        <span id="toastMsg"></span>
    </div>

    <script>
    const WA_KEY = 'lunomi_wa_config';
    let templates = [];

    const DEFAULT_TEMPLATES = [
        { id: 'tpl_booking', name: 'Konfirmasi Booking', msg: 'Halo {nama}! Reservasi Anda di {outlet} untuk {tanggal} telah dikonfirmasi. Terima kasih! 🙏' },
        { id: 'tpl_receipt', name: 'Struk Digital', msg: 'Halo {nama}, terima kasih telah makan di {outlet}! Total: {total}. Sampai jumpa lagi! 😊' },
        { id: 'tpl_promo', name: 'Promo Spesial', msg: 'Halo {nama}! Ada promo spesial dari {outlet}. Segera kunjungi kami! 🎉' }
    ];

    function loadWA() {
        const cfg = JSON.parse(localStorage.getItem(WA_KEY) || '{}');
        document.getElementById('waNumber').value = cfg.number || '';
        document.getElementById('waName').value = cfg.businessName || '';
        document.getElementById('notifBooking').checked = cfg.notifBooking ?? true;
        document.getElementById('notifReceipt').checked = cfg.notifReceipt ?? false;
        document.getElementById('notifReady').checked = cfg.notifReady ?? false;
        document.getElementById('notifPromo').checked = cfg.notifPromo ?? false;
        templates = cfg.templates || JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
        renderTemplates();
    }

    function renderTemplates() {
        const list = document.getElementById('templateList');
        list.innerHTML = templates.map((t, i) => `
            <div class="glass-card rounded-xl p-4">
                <div class="flex justify-between items-start mb-2">
                    <input type="text" value="${escHtml(t.name)}" onchange="templates[${i}].name=this.value"
                        class="glass-input px-3 py-1 rounded-lg text-sm font-semibold flex-1 mr-3">
                    <button onclick="deleteTemplate(${i})" class="text-red-400 hover:text-red-300 transition shrink-0">
                        <span class="material-symbols-outlined text-sm">delete</span>
                    </button>
                </div>
                <textarea rows="2" onchange="templates[${i}].msg=this.value"
                    class="glass-input w-full px-3 py-2 rounded-lg text-xs">${escHtml(t.msg)}</textarea>
                <button onclick="sendTemplateTest(${i})" class="mt-2 text-xs text-emerald-400 hover:text-emerald-300 transition flex items-center gap-1">
                    <span class="material-symbols-outlined text-xs">send</span> Test kirim
                </button>
            </div>
        `).join('');
    }

    function escHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function addTemplate() {
        templates.push({ id: 'tpl_' + Date.now(), name: 'Template Baru', msg: 'Halo {nama}!' });
        renderTemplates();
    }

    function deleteTemplate(i) {
        if (!confirm('Hapus template ini?')) return;
        templates.splice(i, 1);
        renderTemplates();
    }

    function sendTemplateTest(i) {
        const number = document.getElementById('waNumber').value.trim();
        if (!number) { alert('Masukkan nomor WA terlebih dahulu.'); return; }
        const outlet = JSON.parse(localStorage.getItem('lunomi_outlet') || '{}');
        const msg = templates[i].msg
            .replace(/{nama}/g, 'Pelanggan')
            .replace(/{total}/g, 'Rp 100.000')
            .replace(/{tanggal}/g, new Date().toLocaleDateString('id-ID'))
            .replace(/{outlet}/g, outlet.name || 'Outlet');
        window.open('https://wa.me/62' + number + '?text=' + encodeURIComponent(msg), '_blank');
    }

    function testWA() {
        const number = document.getElementById('waNumber').value.trim();
        if (!number) { alert('Masukkan nomor WA terlebih dahulu.'); return; }
        window.open('https://wa.me/62' + number + '?text=' + encodeURIComponent('Halo! Ini adalah test pesan dari Lunomi POS. ✅'), '_blank');
    }

    function saveWA() {
        const cfg = {
            number: document.getElementById('waNumber').value.trim(),
            businessName: document.getElementById('waName').value.trim(),
            notifBooking: document.getElementById('notifBooking').checked,
            notifReceipt: document.getElementById('notifReceipt').checked,
            notifReady: document.getElementById('notifReady').checked,
            notifPromo: document.getElementById('notifPromo').checked,
            templates,
            updatedAt: new Date().toISOString()
        };
        localStorage.setItem(WA_KEY, JSON.stringify(cfg));
        if (typeof AuditLog !== 'undefined') AuditLog.add('wa_config_save', 'WhatsApp config disimpan — No: ' + (cfg.number || 'kosong'));
        showToast('Pengaturan WhatsApp disimpan!');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        t.style.opacity = '1';
        setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        try { const s = localStorage.getItem('lunomi_session'); if (!s) { window.location.href = 'index.html'; return; } }
        catch(e) { window.location.href = 'index.html'; return; }
        loadWA();
    });
    </script>
</body>
</html>
