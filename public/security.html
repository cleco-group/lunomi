<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keamanan Akun - Lunomi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: white; min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .glass-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: white; }
        .glass-input:focus { outline: none; border-color: rgba(239,68,68,0.5); background: rgba(255,255,255,0.08); }
        .glass-input option { background: #1e293b; }
        .pin-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); transition: all 0.2s; }
        .pin-dot.filled { background: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold">Keamanan Akun</h1>
                <p class="text-sm text-white/50">Kelola PIN, sesi, dan log aktivitas</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="px-4 py-2 rounded-xl glass-card text-sm font-semibold">Kembali</button>
        </div>

        <div class="space-y-6">
            <!-- Ganti PIN Kasir -->
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-red-400">pin</span> PIN Kasir
                </h3>
                <p class="text-xs text-white/40 mb-4">PIN 4 digit digunakan untuk membuka POS dan konfirmasi transaksi penting.</p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">PIN Lama</label>
                        <input type="password" id="oldPin" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                            class="glass-input w-full px-4 py-2 rounded-xl text-sm tracking-widest" placeholder="••••">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">PIN Baru</label>
                        <input type="password" id="newPin" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                            class="glass-input w-full px-4 py-2 rounded-xl text-sm tracking-widest" placeholder="••••" oninput="updatePinStrength()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">Konfirmasi PIN</label>
                        <input type="password" id="confirmPin" maxlength="4" inputmode="numeric" pattern="[0-9]*"
                            class="glass-input w-full px-4 py-2 rounded-xl text-sm tracking-widest" placeholder="••••">
                    </div>
                </div>
                <div id="pinStrength" class="mt-3 flex gap-1">
                    <div class="pin-dot" id="pd0"></div>
                    <div class="pin-dot" id="pd1"></div>
                    <div class="pin-dot" id="pd2"></div>
                    <div class="pin-dot" id="pd3"></div>
                    <span id="pinStrengthLabel" class="text-xs text-white/30 ml-2">Masukkan PIN baru</span>
                </div>
                <button onclick="changePin()" class="mt-4 px-6 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-sm font-bold transition">
                    Perbarui PIN
                </button>
            </div>

            <!-- Sesi & Timeout -->
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-orange-400">timer</span> Sesi & Timeout
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">Timeout Sesi (menit)</label>
                        <select id="sessionTimeout" class="glass-input w-full px-4 py-2 rounded-xl text-sm">
                            <option value="0">Tidak ada timeout</option>
                            <option value="15">15 menit</option>
                            <option value="30" selected>30 menit</option>
                            <option value="60">1 jam</option>
                            <option value="120">2 jam</option>
                            <option value="480">8 jam</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-white/40 mb-1">Mode Kunci Otomatis</label>
                        <select id="autoLock" class="glass-input w-full px-4 py-2 rounded-xl text-sm">
                            <option value="none">Tidak</option>
                            <option value="pin">Kunci dengan PIN</option>
                            <option value="logout">Logout otomatis</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4 space-y-3">
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Require PIN untuk Refund</p>
                            <p class="text-xs text-white/40">Wajib masuk PIN sebelum proses refund</p>
                        </div>
                        <input type="checkbox" id="pinRefund" checked class="w-4 h-4 accent-red-500">
                    </label>
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Require PIN untuk Hapus Transaksi</p>
                            <p class="text-xs text-white/40">Wajib masuk PIN sebelum void/delete transaksi</p>
                        </div>
                        <input type="checkbox" id="pinVoid" checked class="w-4 h-4 accent-red-500">
                    </label>
                    <label class="flex items-center justify-between p-3 glass-card rounded-xl cursor-pointer hover:bg-white/10 transition">
                        <div>
                            <p class="text-sm font-semibold">Require PIN untuk Diskon</p>
                            <p class="text-xs text-white/40">Wajib masuk PIN untuk memberikan diskon manual</p>
                        </div>
                        <input type="checkbox" id="pinDiscount" class="w-4 h-4 accent-red-500">
                    </label>
                </div>
            </div>

            <!-- Log Aktivitas -->
            <div class="glass-card rounded-2xl overflow-hidden">
                <div class="p-6 border-b border-white/5 flex justify-between items-center">
                    <h3 class="text-base font-bold flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-400">history</span> Log Aktivitas Terbaru
                    </h3>
                    <button onclick="clearAuditLog()" class="text-xs text-red-400 hover:text-red-300 transition flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">delete_sweep</span> Hapus Log
                    </button>
                </div>
                <div id="auditLog" class="divide-y divide-white/5 max-h-64 overflow-y-auto">
                    <div class="px-6 py-8 text-center text-white/30 text-sm">Tidak ada log aktivitas</div>
                </div>
            </div>

            <!-- Sesi Aktif -->
            <div class="glass-card rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold flex items-center gap-2">
                        <span class="material-symbols-outlined text-emerald-400">devices</span> Sesi Aktif
                    </h3>
                    <button onclick="logoutAllSessions()" class="text-xs text-red-400 hover:text-red-300 transition">Logout Semua</button>
                </div>
                <div id="sessionInfo" class="glass-card rounded-xl p-4 text-sm space-y-2"></div>
            </div>

            <!-- Tombol Simpan -->
            <div class="flex justify-end gap-3">
                <button onclick="saveSecuritySettings()" class="px-8 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-sm font-bold transition shadow-lg shadow-red-500/20">
                    Simpan Pengaturan
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">check_circle</span>
        <span id="toastMsg"></span>
    </div>

    <script>
    const SEC_KEY = 'lunomi_security';
    const AUDIT_KEY = 'lunomi_audit_log';

    function loadSecurity() {
        const sec = JSON.parse(localStorage.getItem(SEC_KEY) || '{}');
        document.getElementById('sessionTimeout').value = sec.sessionTimeout ?? 30;
        document.getElementById('autoLock').value = sec.autoLock || 'none';
        document.getElementById('pinRefund').checked = sec.pinRefund ?? true;
        document.getElementById('pinVoid').checked = sec.pinVoid ?? true;
        document.getElementById('pinDiscount').checked = sec.pinDiscount ?? false;
        loadAuditLog();
        loadSessionInfo();
    }

    function updatePinStrength() {
        const pin = document.getElementById('newPin').value;
        const len = pin.length;
        for (let i = 0; i < 4; i++) {
            document.getElementById('pd' + i).classList.toggle('filled', i < len);
        }
        const labels = ['', 'Terlalu pendek', 'Terlalu pendek', 'Hampir', 'PIN siap'];
        document.getElementById('pinStrengthLabel').textContent = labels[len] || 'Masukkan PIN baru';
        document.getElementById('pinStrengthLabel').style.color = len === 4 ? '#4ade80' : 'rgba(255,255,255,0.3)';
    }

    function changePin() {
        const oldPin = document.getElementById('oldPin').value;
        const newPin = document.getElementById('newPin').value;
        const confirmPin = document.getElementById('confirmPin').value;

        if (newPin.length !== 4 || !/^\d{4}$/.test(newPin)) { alert('PIN harus 4 digit angka.'); return; }
        if (newPin !== confirmPin) { alert('Konfirmasi PIN tidak cocok.'); return; }

        const sec = JSON.parse(localStorage.getItem(SEC_KEY) || '{}');
        if (sec.pin && sec.pin !== oldPin) { alert('PIN lama tidak sesuai.'); return; }

        sec.pin = newPin;
        sec.pinChangedAt = new Date().toISOString();
        localStorage.setItem(SEC_KEY, JSON.stringify(sec));

        if (typeof AuditLog !== 'undefined') AuditLog.add('security_pin_change', 'PIN kasir diperbarui');

        document.getElementById('oldPin').value = '';
        document.getElementById('newPin').value = '';
        document.getElementById('confirmPin').value = '';
        for (let i = 0; i < 4; i++) document.getElementById('pd' + i).classList.remove('filled');

        showToast('PIN berhasil diperbarui!');
        loadAuditLog();
    }

    function loadAuditLog() {
        const logs = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]');
        const container = document.getElementById('auditLog');
        if (!logs.length) {
            container.innerHTML = '<div class="px-6 py-8 text-center text-white/30 text-sm">Tidak ada log aktivitas</div>';
            return;
        }
        const recent = [...logs].reverse().slice(0, 20);
        container.innerHTML = recent.map(l => {
            const dt = l.ts ? new Date(l.ts).toLocaleString('id-ID', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '-';
            return `
                <div class="px-6 py-3 flex justify-between items-start gap-4">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate">${l.desc || l.type || '-'}</p>
                        <p class="text-xs text-white/30 font-mono">${l.type || ''}</p>
                    </div>
                    <span class="text-xs text-white/30 shrink-0">${dt}</span>
                </div>
            `;
        }).join('');
    }

    function clearAuditLog() {
        if (!confirm('Hapus semua log aktivitas? Tindakan ini tidak bisa dibatalkan.')) return;
        localStorage.removeItem(AUDIT_KEY);
        loadAuditLog();
        showToast('Log aktivitas dihapus');
    }

    function loadSessionInfo() {
        const session = JSON.parse(localStorage.getItem('lunomi_session') || '{}');
        const outlet = JSON.parse(localStorage.getItem('lunomi_outlet') || '{}');
        const container = document.getElementById('sessionInfo');
        container.innerHTML = `
            <div class="flex justify-between"><span class="text-white/40">Pengguna</span><span class="font-semibold">${session.name || session.username || 'Admin'}</span></div>
            <div class="flex justify-between"><span class="text-white/40">Outlet</span><span class="font-semibold">${outlet.name || '-'}</span></div>
            <div class="flex justify-between"><span class="text-white/40">Role</span><span class="font-semibold capitalize">${session.role || 'admin'}</span></div>
            <div class="flex justify-between"><span class="text-white/40">Login sejak</span><span class="font-semibold">${session.loginAt ? new Date(session.loginAt).toLocaleString('id-ID') : 'Sesi ini'}</span></div>
            <div class="flex justify-between items-center mt-2">
                <span class="flex items-center gap-1 text-emerald-400 text-xs"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Aktif</span>
                <button onclick="logoutNow()" class="text-xs text-red-400 hover:text-red-300 transition">Logout</button>
            </div>
        `;
    }

    function logoutNow() {
        if (!confirm('Logout sekarang?')) return;
        if (typeof AuditLog !== 'undefined') AuditLog.add('security_logout', 'Logout manual dari halaman keamanan');
        localStorage.removeItem('lunomi_session');
        window.location.href = 'index.html';
    }

    function logoutAllSessions() {
        if (!confirm('Logout semua sesi aktif? Anda akan diarahkan ke login.')) return;
        if (typeof AuditLog !== 'undefined') AuditLog.add('security_logout_all', 'Logout semua sesi');
        localStorage.removeItem('lunomi_session');
        window.location.href = 'index.html';
    }

    function saveSecuritySettings() {
        const sec = JSON.parse(localStorage.getItem(SEC_KEY) || '{}');
        sec.sessionTimeout = parseInt(document.getElementById('sessionTimeout').value) || 0;
        sec.autoLock = document.getElementById('autoLock').value;
        sec.pinRefund = document.getElementById('pinRefund').checked;
        sec.pinVoid = document.getElementById('pinVoid').checked;
        sec.pinDiscount = document.getElementById('pinDiscount').checked;
        sec.updatedAt = new Date().toISOString();
        localStorage.setItem(SEC_KEY, JSON.stringify(sec));
        if (typeof AuditLog !== 'undefined') AuditLog.add('security_settings_save', 'Pengaturan keamanan disimpan — timeout ' + sec.sessionTimeout + ' mnt');
        showToast('Pengaturan keamanan disimpan!');
        loadAuditLog();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        t.style.opacity = '1';
        setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        try { const s = localStorage.getItem('lunomi_session'); if (!s) { window.location.href = 'index.html'; return; } }
        catch(e) { window.location.href = 'index.html'; return; }
        loadSecurity();
    });
    </script>
</body>
</html>
