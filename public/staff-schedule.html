<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Staf — Lunomi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/lunomi-core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;}
        body{min-height:100vh;background:#020617;background-image:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(99,102,241,.2) 0%,transparent 60%),radial-gradient(ellipse 60% 45% at 90% 100%,rgba(56,189,248,.1) 0%,transparent 60%);color:white;overflow-x:hidden;}
        .glass-nav{background:rgba(2,6,23,.7);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);}
        .glass-card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);}
        .input-glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:white;}
        .input-glass::placeholder{color:rgba(255,255,255,.35);}
        .input-glass:focus{outline:none;border-color:rgba(99,102,241,.7);box-shadow:0 0 0 3px rgba(99,102,241,.15);}
        .shift-pagi{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#7dd3fc;}
        .shift-siang{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:#fcd34d;}
        .shift-malam{background:rgba(129,140,248,.15);border:1px solid rgba(129,140,248,.3);color:#a5b4fc;}
        .slot-empty{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.1);cursor:pointer;transition:all .2s;}
        .slot-empty:hover{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.4);}
        .slot-filled{cursor:pointer;transition:all .2s;border-radius:.6rem;padding:.4rem .5rem;}
        .slot-filled:hover{filter:brightness(1.2);}
        .day-today{background:rgba(99,102,241,.12);border-bottom:2px solid #6366f1;}
        @media(max-width:768px){input,select,textarea{font-size:16px!important;}}
    </style>
</head>
<body>
<nav class="glass-nav sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
        <button onclick="window.location.href='dashboard.html'" class="text-white opacity-50 hover:opacity-100 transition text-lg">←</button>
        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base" style="background:linear-gradient(135deg,#38bdf8,#0284c7)">📅</div>
        <div>
            <div class="font-extrabold text-white text-sm">Penjadwalan Staf</div>
            <div class="text-xs" id="outletLabel" style="color:rgba(255,255,255,.4)">-</div>
        </div>
        <div class="ml-auto flex items-center gap-2">
            <button onclick="prevWeek()" class="p-2 glass-card rounded-xl text-sm font-bold hover:bg-white/10 transition">←</button>
            <span id="weekLabel" class="text-sm font-bold px-3"></span>
            <button onclick="nextWeek()" class="p-2 glass-card rounded-xl text-sm font-bold hover:bg-white/10 transition">→</button>
            <button onclick="goToday()" class="px-3 py-2 rounded-xl text-xs font-bold ml-1" style="background:rgba(99,102,241,.2);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)">Minggu Ini</button>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsRow"></div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-4 mb-4 text-xs font-bold">
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm shift-pagi inline-block"></span>Pagi 07:00–15:00</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm shift-siang inline-block"></span>Siang 13:00–21:00</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm shift-malam inline-block"></span>Malam 19:00–03:00</div>
        <span class="text-white/30 ml-2">Klik slot untuk assign staf</span>
    </div>

    <!-- Schedule Grid -->
    <div class="glass-card rounded-2xl overflow-x-auto">
        <table class="w-full min-w-[700px] border-collapse">
            <thead>
                <tr id="gridHeader" class="bg-white/5 text-xs font-bold uppercase text-white/40"></tr>
            </thead>
            <tbody id="gridBody"></tbody>
        </table>
    </div>

    <!-- Weekly Summary -->
    <div class="mt-6">
        <h3 class="text-xs font-bold text-white/40 uppercase tracking-widest mb-3">Ringkasan Shift Minggu Ini</h3>
        <div id="summaryList" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </div>
</div>

<!-- Assign Modal -->
<div id="assignModal" style="display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="rounded-2xl p-6 w-full max-w-sm shadow-2xl" style="background:#0f172a;border:1px solid rgba(255,255,255,.1)">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h3 class="font-bold" id="assignTitle">Assign Shift</h3>
                <p class="text-xs text-white/40 mt-0.5" id="assignSubtitle"></p>
            </div>
            <button onclick="closeAssign()" class="text-white/40 hover:text-white text-xl">✕</button>
        </div>
        <div>
            <label class="text-xs font-semibold text-white/40 mb-1.5 block">Pilih Staf</label>
            <select id="staffSelect" class="input-glass w-full px-3 py-2.5 rounded-xl text-sm">
                <option value="">— Kosongkan Slot —</option>
            </select>
        </div>
        <div class="flex gap-3 mt-5">
            <button onclick="closeAssign()" class="flex-1 py-2.5 rounded-xl text-sm font-semibold" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)">Batal</button>
            <button onclick="saveAssign()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">Simpan</button>
        </div>
    </div>
</div>

<script>
const SCHED_KEY='lunomi_schedules';
const SHIFTS=[
    {key:'pagi',label:'Pagi',time:'07:00–15:00',cls:'shift-pagi'},
    {key:'siang',label:'Siang',time:'13:00–21:00',cls:'shift-siang'},
    {key:'malam',label:'Malam',time:'19:00–03:00',cls:'shift-malam'},
];
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
let currentWeekStart=null, assignTarget=null;

function getSchedules(){return JSON.parse(localStorage.getItem(SCHED_KEY)||'{}');}
function saveSchedules(obj){localStorage.setItem(SCHED_KEY,JSON.stringify(obj));}

function getWeekKey(date){
    const d=new Date(date);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()-d.getDay());
    return d.toISOString().slice(0,10);
}

function getWeekStart(date){
    const d=new Date(date);
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()-d.getDay());
    return d;
}

function getStaffList(){
    return JSON.parse(localStorage.getItem('lunomi_staff')||'[]').filter(s=>s.status==='active'||!s.status);
}

function prevWeek(){currentWeekStart.setDate(currentWeekStart.getDate()-7);render();}
function nextWeek(){currentWeekStart.setDate(currentWeekStart.getDate()+7);render();}
function goToday(){currentWeekStart=getWeekStart(new Date());render();}

function render(){
    const weekKey=currentWeekStart.toISOString().slice(0,10);
    const today=new Date().toISOString().slice(0,10);
    const MONTH_ID=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

    // Week label
    const weekEnd=new Date(currentWeekStart);weekEnd.setDate(weekEnd.getDate()+6);
    document.getElementById('weekLabel').textContent=
        `${currentWeekStart.getDate()} ${MONTH_ID[currentWeekStart.getMonth()]} – ${weekEnd.getDate()} ${MONTH_ID[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;

    const schedules=getSchedules();
    const weekData=schedules[weekKey]||{};

    // Build day dates
    const dayDates=[];
    for(let i=0;i<7;i++){const d=new Date(currentWeekStart);d.setDate(d.getDate()+i);dayDates.push(d);}

    // Header
    const header=document.getElementById('gridHeader');
    header.innerHTML=`<th class="px-3 py-3 text-left w-24">Shift</th>`+
        dayDates.map((d,i)=>{
            const iso=d.toISOString().slice(0,10);
            const isToday=iso===today;
            return `<th class="px-2 py-3 text-center${isToday?' day-today':''}">${DAYS[i]}<br><span class="font-black text-white text-base">${d.getDate()}</span></th>`;
        }).join('');

    // Body
    const body=document.getElementById('gridBody');
    body.innerHTML=SHIFTS.map(sh=>`
        <tr class="border-t border-white/5">
            <td class="px-3 py-3">
                <div class="text-xs font-bold text-white/70">${sh.label}</div>
                <div class="text-[9px] text-white/35">${sh.time}</div>
            </td>
            ${dayDates.map((d,i)=>{
                const iso=d.toISOString().slice(0,10);
                const isToday=iso===today;
                const assignment=weekData[iso]?.[sh.key];
                const staffName=assignment?.name||'';
                const staffRole=assignment?.role||'';
                if(assignment){
                    return `<td class="px-2 py-2${isToday?' bg-indigo-500/5':''}">
                        <div class="slot-filled ${sh.cls}" onclick="openAssign('${weekKey}','${iso}','${sh.key}')">
                            <div class="text-[10px] font-bold leading-tight">${staffName}</div>
                            <div class="text-[8px] opacity-60 mt-0.5">${staffRole}</div>
                        </div>
                    </td>`;
                } else {
                    return `<td class="px-2 py-2${isToday?' bg-indigo-500/5':''}">
                        <div class="slot-empty rounded-lg h-12 flex items-center justify-center text-white/20 text-lg" onclick="openAssign('${weekKey}','${iso}','${sh.key}')">+</div>
                    </td>`;
                }
            }).join('')}
        </tr>`).join('');

    renderStats(weekData,dayDates);
    renderSummary(weekData,dayDates);
}

function renderStats(weekData,dayDates){
    let totalShifts=0,filledShifts=0;
    dayDates.forEach(d=>{
        const iso=d.toISOString().slice(0,10);
        SHIFTS.forEach(sh=>{
            totalShifts++;
            if(weekData[iso]?.[sh.key]) filledShifts++;
        });
    });
    const staff=getStaffList();
    const assignedIds=new Set();
    dayDates.forEach(d=>{
        const iso=d.toISOString().slice(0,10);
        SHIFTS.forEach(sh=>{if(weekData[iso]?.[sh.key]?.id) assignedIds.add(weekData[iso][sh.key].id);});
    });
    const stats=[
        {label:'Total Slot',val:totalShifts,color:'rgba(255,255,255,.7)'},
        {label:'Terisi',val:filledShifts,color:'#6ee7b7'},
        {label:'Kosong',val:totalShifts-filledShifts,color:'#fca5a5'},
        {label:'Staf Terjadwal',val:assignedIds.size+'/'+staff.length,color:'#a5b4fc'},
    ];
    document.getElementById('statsRow').innerHTML=stats.map(s=>`
        <div class="glass-card rounded-2xl p-4">
            <p class="text-xs text-white/40 mb-1">${s.label}</p>
            <p class="text-xl font-black" style="color:${s.color}">${s.val}</p>
        </div>`).join('');
}

function renderSummary(weekData,dayDates){
    const staff=getStaffList();
    const counts={};
    staff.forEach(s=>{counts[s.id]={name:s.name,role:s.jabatan||s.role||'-',shifts:0};});
    dayDates.forEach(d=>{
        const iso=d.toISOString().slice(0,10);
        SHIFTS.forEach(sh=>{
            const a=weekData[iso]?.[sh.key];
            if(a?.id && counts[a.id]) counts[a.id].shifts++;
        });
    });
    const rows=Object.values(counts).filter(x=>x.shifts>0).sort((a,b)=>b.shifts-a.shifts);
    if(!rows.length){
        document.getElementById('summaryList').innerHTML=`<p class="col-span-4 text-white/25 text-sm text-center py-4">Belum ada jadwal minggu ini</p>`;
        return;
    }
    document.getElementById('summaryList').innerHTML=rows.map(r=>`
        <div class="glass-card rounded-xl p-3 flex justify-between items-center">
            <div>
                <div class="text-sm font-bold">${r.name}</div>
                <div class="text-xs text-white/40">${r.role}</div>
            </div>
            <div class="text-xl font-black text-indigo-400">${r.shifts}<span class="text-xs font-normal text-white/40 ml-0.5">shift</span></div>
        </div>`).join('');
}

function openAssign(weekKey,dayIso,shiftKey){
    const schedules=getSchedules();
    const existing=schedules[weekKey]?.[dayIso]?.[shiftKey];
    const sh=SHIFTS.find(s=>s.key===shiftKey);
    const d=new Date(dayIso);
    const MONTH_ID=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
    document.getElementById('assignTitle').textContent=`Assign ${sh.label}`;
    document.getElementById('assignSubtitle').textContent=`${DAYS[d.getDay()]} ${d.getDate()} ${MONTH_ID[d.getMonth()]} — ${sh.time}`;

    const staff=getStaffList();
    const sel=document.getElementById('staffSelect');
    sel.innerHTML='<option value="">— Kosongkan Slot —</option>'+
        staff.map(s=>`<option value="${s.id}" ${existing?.id===s.id?'selected':''}>${s.name} (${s.jabatan||s.role||'-'})</option>`).join('');

    assignTarget={weekKey,dayIso,shiftKey};
    document.getElementById('assignModal').style.display='flex';
}

function closeAssign(){document.getElementById('assignModal').style.display='none';assignTarget=null;}

function saveAssign(){
    if(!assignTarget) return;
    const {weekKey,dayIso,shiftKey}=assignTarget;
    const staffId=document.getElementById('staffSelect').value;
    const schedules=getSchedules();
    if(!schedules[weekKey]) schedules[weekKey]={};
    if(!schedules[weekKey][dayIso]) schedules[weekKey][dayIso]={};

    if(!staffId){
        delete schedules[weekKey][dayIso][shiftKey];
    } else {
        const staff=getStaffList().find(s=>s.id==staffId||s.id===staffId);
        schedules[weekKey][dayIso][shiftKey]={id:staff.id,name:staff.name,role:staff.jabatan||staff.role||'-'};
        const session=SessionManager.get('session');
        AuditLog.add('schedule_assign',`${session?.name||'Staff'} jadwalkan ${staff.name} — ${SHIFTS.find(s=>s.key===shiftKey)?.label} ${dayIso}`);
    }
    saveSchedules(schedules);
    closeAssign();
    render();
}

document.addEventListener('DOMContentLoaded',()=>{
    try{
        const s=SessionManager.get('session');
        if(!s){window.location.href='index.html';return;}
        const outlet=SessionManager.get('outlet');
        document.getElementById('outletLabel').textContent=outlet?.name||'Semua Outlet';
    } catch(e){window.location.href='index.html';}
    currentWeekStart=getWeekStart(new Date());
    render();
});
</script>
</body>
</html>
